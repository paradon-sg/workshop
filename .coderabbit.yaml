# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

early_access: false

tone_instructions: >
  Be concise and practical.
  Prioritize correctness, security, performance, and maintainability.
  Do not report trivial style issues already handled by RuboCop.
  Only report issues that are actionable and relevant to the changed code.

reviews:
  profile: "chill"

  request_changes_workflow: true

  high_level_summary: true
  sequence_diagrams: false
  poem: false
  review_status: true
  changed_files_summary: true

  path_filters:
    - "!**/vendor/**"
    - "!**/tmp/**"
    - "!**/log/**"
    - "!**/coverage/**"
    - "!**/node_modules/**"

  path_instructions:
    - path: "**/*.rb"
      instructions: |
        Review this Ruby on Rails application with these priorities:

        1. Correctness
        - Identify logic bugs and incorrect behavior.
        - Check edge cases and unexpected nil values.
        - Check transaction and error-handling behavior.
        - Check for incorrect assumptions about database state.

        2. Rails best practices
        - Follow standard Rails conventions.
        - Keep controllers thin.
        - Avoid unnecessary callbacks.
        - Prefer clear and maintainable ActiveRecord code.
        - Prefer Rails conventions over unnecessary abstractions.
        - Avoid introducing unnecessary service objects or layers.

        3. Database performance
        - Detect N+1 queries.
        - Detect unnecessary database queries.
        - Check inefficient ActiveRecord usage.
        - Check queries executed inside loops.
        - Check queries executed from views, serializers, presenters, and decorators.
        - Check whether associations accessed after loading records should use eager loading.
        - Recommend includes, preload, or eager_load when they prevent an actual or likely N+1 query.
        - Do not recommend includes when the association is not actually used.
        - Do not recommend eager loading solely as a general performance preference.
        - Check whether queries load unnecessary records or columns.
        - Check whether indexes may be required for new query patterns.
        - Consider performance impact on large datasets.
        - Pay particular attention to list and index actions.

        4. Security
        - Check authentication and authorization.
        - Check user-controlled parameters.
        - Check SQL injection risks.
        - Check mass-assignment and unsafe attribute updates.
        - Check sensitive data exposure.
        - Check insecure redirects.
        - Check unsafe file handling.
        - Check unsafe deserialization.
        - Check authorization at the resource level where appropriate.

        5. Testing
        - Check whether important changed behavior has appropriate tests.
        - Check edge cases.
        - Check failure paths.
        - Check authorization and validation behavior where relevant.
        - Avoid tests that depend unnecessarily on implementation details.
        - Do not require tests for trivial changes when existing coverage is sufficient.

        6. Maintainability
        - Prefer simple solutions over unnecessary abstractions.
        - Flag duplicated business logic when it creates maintenance risk.
        - Avoid unnecessarily complex methods and classes.
        - Keep responsibilities separated.
        - Prefer readable code over clever code.

        7. Ruby style
        - Follow the repository's .rubocop.yml.
        - Follow Ruby Style Guide conventions.
        - Do not report formatting issues already handled by RuboCop.
        - Do not duplicate RuboCop findings unless they affect correctness,
          maintainability, or readability.

    - path: "app/controllers/**/*.rb"
      instructions: |
        Review Rails controllers carefully.

        Check for:

        - Controllers becoming too large.
        - Business logic that should be moved elsewhere.
        - Missing authentication or authorization.
        - Strong parameter issues.
        - Incorrect HTTP status codes.
        - Inconsistent error handling.
        - Unnecessary database queries.
        - N+1 queries.
        - Associations used by views or serializers without eager loading.
        - Queries inside loops.
        - Loading unnecessarily large datasets.

        For index/list actions:

        - Check whether returned collections can become large.
        - Check whether pagination is appropriate.
        - Check whether sorting/filtering is performed efficiently.
        - Check whether associations used by the response should use
          includes, preload, or eager_load.

        Example:

        Bad:
          @books = Book.order(:title)

        If the response later accesses:
          book.author.name

        Flag the potential N+1 query and recommend:

          @books = Book.includes(:author).order(:title)

        Do not flag Book.order(:title) by itself when no association is used.

    - path: "app/models/**/*.rb"
      instructions: |
        Review Rails models carefully.

        Check for:

        - Incorrect associations.
        - Missing or incorrect validations.
        - Callback side effects.
        - N+1 query risks.
        - Inefficient scopes.
        - Queries that load unnecessary records.
        - Business logic that should be moved to another layer.
        - Transaction consistency.
        - Potential race conditions.
        - Missing database constraints where appropriate.

        Do not recommend eager loading inside model associations or scopes
        unless there is a clear performance reason.

    - path: "app/services/**/*.rb"
      instructions: |
        Review service objects for:

        - Clear single responsibility.
        - Proper error handling.
        - Transaction boundaries.
        - Unnecessary complexity.
        - Difficult-to-test side effects.
        - Duplicate business logic.
        - N+1 queries.
        - Unnecessary database round trips.
        - External API calls inside transactions when they can create
          consistency or locking problems.

    - path: "app/queries/**/*.rb"
      instructions: |
        Review database query objects carefully.

        Check for:

        - N+1 queries.
        - Missing eager loading.
        - Unnecessary database round trips.
        - Inefficient joins.
        - Missing indexes.
        - Loading unnecessary records.
        - Loading unnecessary columns.
        - Queries inside loops.
        - Potential performance regressions with large datasets.

        When an association is accessed after loading a collection,
        recommend includes, preload, or eager_load when appropriate.

        Do not recommend eager loading associations that are never used.

    - path: "app/jobs/**/*.rb"
      instructions: |
        Review background jobs for:

        - Idempotency.
        - Retry safety.
        - Proper exception handling.
        - Race conditions.
        - Duplicate processing.
        - Transaction consistency.
        - External API interaction issues.
        - N+1 queries.
        - Excessive database queries.
        - Jobs processing unexpectedly large datasets.

    - path: "app/mailers/**/*.rb"
      instructions: |
        Review mailers for:

        - Sensitive data exposure.
        - Incorrect recipients.
        - Missing required parameters.
        - Unnecessary database queries.
        - N+1 queries.
        - Consistent mailer behavior.

    - path: "app/views/**/*.erb"
      instructions: |
        Review ERB templates for:

        - XSS risks.
        - Unsafe HTML rendering.
        - N+1 queries caused by view code.
        - Associations accessed inside loops without eager loading.
        - Business logic in views.
        - Accessibility issues where relevant.

        If a view accesses an association for every record in a collection,
        check whether the controller or query object should use includes,
        preload, or eager_load.

    - path: "db/migrate/**/*.rb"
      instructions: |
        Review Rails migrations carefully.

        Check for:

        - Safe schema changes.
        - Missing indexes.
        - Indexes required for foreign keys or frequently queried columns.
        - Expensive data migrations.
        - Potential table locking or downtime.
        - Reversibility where appropriate.
        - Production safety for large tables.
        - Unsafe column changes on large tables.
        - Duplicate or redundant indexes.

        Pay particular attention to migrations that will run against
        large production tables.

    - path: "spec/**/*.rb"
      instructions: |
        Review RSpec tests for:

        - Meaningful coverage of changed behavior.
        - Missing edge cases.
        - Missing failure-path tests.
        - Missing authorization tests where relevant.
        - Fragile tests.
        - Excessive mocking.
        - Flaky tests.
        - Tests coupled unnecessarily to implementation details.

        Do not require tests for trivial refactoring when behavior is
        unchanged and existing coverage is sufficient.

    - path: "test/**/*.rb"
      instructions: |
        Review Rails tests for:

        - Meaningful coverage of changed behavior.
        - Missing edge cases.
        - Failure-path coverage.
        - Authorization coverage where relevant.
        - Flaky tests.
        - Excessive mocking or stubbing.
        - Tests coupled unnecessarily to implementation details.

  tools:
    rubocop:
      enabled: true

    brakeman:
      enabled: true

    semgrep:
      enabled: true

    gitleaks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
